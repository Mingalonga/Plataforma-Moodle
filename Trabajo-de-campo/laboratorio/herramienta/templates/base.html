<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestión centralizada · ATU</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>
<body>
  <header>
    <img src="{{ url_for('static', filename='logo.png') }}" alt="ATU">
    <span class="titulo">Gestión centralizada de aulas</span>
    {% if session.usuario %}
    <nav class="menu"><a href="{{ url_for('vista') }}">Vista</a><a href="{{ url_for('ver_registro') }}">Registro de cambios</a></nav>
    <form method="post" action="{{ url_for('salir') }}">
      <input type="hidden" name="csrf" value="{{ token_formulario() }}">
      <span>{{ session.usuario }}</span>
      <button class="cortado">Salir</button>
    </form>
    {% endif %}
  </header>
  <main>{% block contenido %}{% endblock %}</main>
</body>
</html>
